# Сервер в зале. Проще всего запускать скриптом: scripts/start.sh (Linux, macOS) или scripts\start.ps1 (Windows).
# Вручную: задайте ADMIN_TOKEN (не короче 16 символов) в файле .env рядом с этим файлом и выполните docker compose up -d.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymnastics
      POSTGRES_PASSWORD: gymnastics
      POSTGRES_DB: gymnastics
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gymnastics"]
      interval: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gymnastics:gymnastics@db:5432/gymnastics
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Задайте ADMIN_TOKEN в .env}
      PORT: 3000
      # Часовой пояс для времени в протоколах.
      TZ: ${TZ:-Europe/Moscow}
      # Если заданы, результаты уходят на сайт через облачный ретранслятор.
      RELAY_URL: ${RELAY_URL:-}
      RELAY_TOKEN: ${RELAY_TOKEN:-}
      # Каждые полчаса турниры сохраняются файлами в backups/tournaments,
      # их загружают кнопкой «Загрузить турнир из файла».
      EXPORT_DIR: /backups/tournaments
      EXPORT_INTERVAL: ${EXPORT_INTERVAL:-1800}
    volumes:
      - ./backups:/backups
    ports:
      - "3000:3000"

  # Резервные копии базы в папку backups рядом с этим файлом: каждые 5 минут, хранятся последние 288 (сутки).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: gymnastics
      PGPASSWORD: gymnastics
      PGDATABASE: gymnastics
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-300}
      BACKUP_KEEP: ${BACKUP_KEEP:-288}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]

volumes:
  db-data:

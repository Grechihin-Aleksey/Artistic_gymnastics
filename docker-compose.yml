# Сервер в зале. Проще всего запускать скриптом: scripts/start.sh (Linux, macOS) или scripts\start.ps1 (Windows).
# Вручную: задайте ADMIN_TOKEN (не короче 16 символов) в файле .env рядом с этим файлом и выполните docker compose up -d.
# Журналы контейнеров не больше 3 файлов по 10 МБ: иначе за сезон они разрастаются на гигабайты.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymnastics
      POSTGRES_PASSWORD: gymnastics
      POSTGRES_DB: gymnastics
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gymnastics"]
      interval: 5s
      retries: 10

  server:
    logging: *logging
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gymnastics:gymnastics@db:5432/gymnastics
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Задайте ADMIN_TOKEN в .env}
      # Ключ лицензии; удобнее ввести его в секретариате, блок «Лицензия».
      LICENSE_KEY: ${LICENSE_KEY:-}
      PORT: 3000
      # Часовой пояс для времени в протоколах.
      TZ: ${TZ:-Europe/Moscow}
      # Если заданы, результаты уходят на сайт через облачный ретранслятор.
      RELAY_URL: ${RELAY_URL:-}
      RELAY_TOKEN: ${RELAY_TOKEN:-}
      # Как часто самому забирать онлайн-заявки с сайта, секунды; 0 — только по кнопке.
      ENTRIES_SYNC_INTERVAL: ${ENTRIES_SYNC_INTERVAL:-300}
      # Каждые полчаса турниры сохраняются файлами в backups/tournaments,
      # их загружают кнопкой «Загрузить турнир из файла».
      EXPORT_DIR: /backups/tournaments
      EXPORT_INTERVAL: ${EXPORT_INTERVAL:-1800}
      # Если заданы, копии базы и турниров уходят ещё и в облачное хранилище S3.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_PREFIX: ${S3_PREFIX:-gymnastics}
      S3_INTERVAL: ${S3_INTERVAL:-900}
      # Раз в 6 часов сервер смотрит, вышла ли новая версия программы, и сообщает в секретариат.
      # Для закрытого репозитория нужен тот же ключ, что у «Обновить.bat». UPDATE_CHECK=off — не проверять.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      UPDATE_CHECK: ${UPDATE_CHECK:-}
      BACKUP_DIR: /backups
      # Видеоповторы с IP-камер (необязательно): камеры подключают в секретариате, блок «Камеры видеоповторов».
      # Запись и ролики лежат в папке video рядом с этим файлом.
      VIDEO_DIR: /video
      VIDEO_KEEP_HOURS: ${VIDEO_KEEP_HOURS:-3}
      VIDEO_CLIP_DAYS: ${VIDEO_CLIP_DAYS:-14}
      VIDEO_MIN_FREE_GB: ${VIDEO_MIN_FREE_GB:-5}
    volumes:
      - ./backups:/backups
      - ./video:/video
    ports:
      - "3000:3000"

  # Резервные копии базы в папку backups рядом с этим файлом: каждые 5 минут, хранятся последние 288 (сутки).
  # Раз в сутки свежая копия пробно разворачивается во временную базу (итог в «Готовности к старту»).
  # Если на диске меньше MIN_FREE_MB мегабайт, старые копии удаляются раньше срока.
  backup:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: gymnastics
      PGPASSWORD: gymnastics
      PGDATABASE: gymnastics
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-300}
      BACKUP_KEEP: ${BACKUP_KEEP:-288}
      MIN_FREE_MB: ${MIN_FREE_MB:-2048}
      RESTORE_CHECK_INTERVAL: ${RESTORE_CHECK_INTERVAL:-86400}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]

volumes:
  db-data:
